<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141c38" />
      <stop offset="60%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- Cyan to Neon Purple Core Gradient -->
    <linearGradient id="neonGradient" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Bevel Border Gradient -->
    <linearGradient id="bevelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.6)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.1)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.6)" />
    </linearGradient>
  </defs>

  <!-- Squircle App Container (Apple Vision / macOS rounded tile) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGlow)" stroke="url(#bevelBorder)" stroke-width="8" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#00f0ff" opacity="0.12" filter="url(#coreGlow)" />
  <circle cx="280" cy="270" r="120" fill="#a855f7" opacity="0.12" filter="url(#coreGlow)" />

  <!-- Neural Mesh Circuit Accents -->
  <path d="M110 370 L170 310 L220 310" stroke="rgba(0,240,255,0.25)" stroke-width="5" stroke-linecap="round" />
  <circle cx="110" cy="370" r="7" fill="#00f0ff" opacity="0.5" />

  <path d="M402 142 L342 202 L292 202" stroke="rgba(168,85,247,0.3)" stroke-width="5" stroke-linecap="round" />
  <circle cx="402" cy="142" r="7" fill="#a855f7" opacity="0.6" />

  <!-- Stylized Iconic "N" Monogram (NeuroOS Core) with Integrated OS Node -->
  <g filter="url(#coreGlow)">
    <!-- Left Vertical Pillar -->
    <path d="M152 368 V144 C152 135 160 128 170 128 H184 C193 128 200 135 200 144 V368 C200 377 193 384 184 384 H170 C160 384 152 377 152 368 Z" fill="url(#neonGradient)" />

    <!-- Right Vertical Pillar -->
    <path d="M312 368 V144 C312 135 319 128 328 128 H342 C352 128 360 135 360 144 V368 C360 377 352 384 342 384 H328 C319 384 312 377 312 368 Z" fill="url(#neonGradient)" />

    <!-- High Velocity Dynamic Diagonal Core -->
    <path d="M168 140 L344 372 C350 380 361 376 361 366 V346 C361 338 357 331 350 322 L182 128 C176 120 165 124 165 134 V140 Z" fill="url(#neonGradient)" />
  </g>

  <!-- Sparkling Autonomous AI Star/Node -->
  <g transform="translate(366, 118)">
    <circle cx="0" cy="0" r="18" fill="#00f0ff" opacity="0.3" filter="url(#coreGlow)" />
    <!-- 4-point Sparkle -->
    <path d="M0 -28 C1 -10 10 -1 28 0 C10 1 1 10 0 28 C-1 10 -10 1 -28 0 C-10 -1 -1 -10 0 -28 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="4.5" fill="#00f0ff" />
  </g>

  <!-- Lower Left Mini Sparkle -->
  <g transform="translate(130, 390)">
    <path d="M0 -14 C0.5 -5 5 -0.5 14 0 C5 0.5 0.5 5 0 14 C-0.5 5 -5 0.5 -14 0 C-5 -0.5 -0.5 -5 0 -14 Z" fill="#00f0ff" opacity="0.8" />
  </g>
</svg>
